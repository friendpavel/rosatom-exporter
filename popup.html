<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 420px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    button { width: 100%; padding: 12px; background: #2d6a4f; color: white; border: none; cursor: pointer; font-size: 14px; font-weight: bold; border-radius: 8px; transition: all 0.2s; }
    button:hover:not(:disabled) { background: #1b4d3e; transform: translateY(-1px); }
    button:disabled { background: #a3b8ae; cursor: not-allowed; }
    #status { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; }
    .ok { background: #d8f3dc; color: #1b4d3e; border-left: 4px solid #2d6a4f; }
    .err { background: #ffe5e5; color: #c92a2a; border-left: 4px solid #c92a2a; }
    #progress { margin-top: 12px; display: none; }
    .progress-bar { background: #e9ecef; border-radius: 8px; overflow: hidden; height: 28px; }
    .progress-fill { background: #2d6a4f; width: 0%; height: 100%; transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold; }
    .progress-text { font-size: 11px; margin-top: 6px; text-align: center; color: #495057; }
    hr { margin: 12px 0; border: none; border-top: 1px solid #dee2e6; }
    .info { font-size: 11px; color: #6c757d; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <button id="btn">📦 Сохранить всё (Excel + XML + файлы)</button>
  <div id="status"></div>
  <div id="progress">
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="progress-text"></div>
  </div>
  <hr>
  <div class="info">
    🔹 Автоматически собирает данные со всех вкладок<br>
    🔹 Сохраняет XML, Excel и все файлы в ZIP<br>
    🔹 Имя архива = "Предмет закупки"
  </div>
  <script src="xlsx.full.min.js"></script>
  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
